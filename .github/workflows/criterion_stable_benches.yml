on:
  schedule:
    - cron: "0 * * * *"
  push:
  pull_request:

name: Criterion stable toolchain benchmarks

jobs:
  release-version:
    name: (release) criterion stable toolchain benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - run: sudo apt install -y valgrind
      - name: run stable benchmarks
        uses: actions-rs/cargo@v1
        with:
          command: bench
  main-branch-version:
    name: (main) criterion stable toolchain benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - run: sudo apt install -y valgrind
      - run: mv Cargo.toml.main Cargo.toml
      - name: run stable benchmarks
        uses: actions-rs/cargo@v1
        with:
          command: bench
  dev-branch-version:
    name: (dev) criterion stable toolchain benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - run: sudo apt install -y valgrind
      - run: mv Cargo.toml.dev Cargo.toml
      - name: run stable benchmarks
        uses: actions-rs/cargo@v1
        with:
          command: bench
